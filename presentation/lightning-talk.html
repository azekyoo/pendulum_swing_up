<title>Nobody Told It About Gravity</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root{
    --ground:#12151d;
    --panel:#1a1e29;
    --panel-2:#212734;
    --rule:#2b3140;
    --ink:#e6e9f0;
    --ink-2:#a8b1c4;
    --ink-3:#79839a;
    --trace:#63b3ff;
    --force:#f2a65a;
    --good:#5fd39a;
    --fail:#ef6673;
    --display:"Archivo","Noto Sans JP","Helvetica Neue",Arial,sans-serif;
    --body:"IBM Plex Sans","Noto Sans JP","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono","Noto Sans JP",ui-monospace,Consolas,monospace;
    --W:1280px; --H:720px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--body);overflow:hidden;
  }

  /* ---------- stage: designed at 1280x720, scaled to fit ---------- */
  #fit{position:fixed;inset:0;display:grid;place-items:center}
  #stage{
    width:var(--W);height:var(--H);position:relative;
    transform-origin:center center;transform:scale(var(--s,1));
    background:var(--ground);
  }
  .slide{
    position:absolute;inset:0;padding:62px 76px 82px;
    display:none;flex-direction:column;
  }
  .slide.live{display:flex}

  /* ---------- type scale ---------- */
  .eyebrow{
    font-family:var(--mono);font-size:12px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--trace);
    margin:0 0 18px;
  }
  h1{
    font-family:var(--display);font-weight:700;font-size:76px;line-height:.98;
    letter-spacing:-.028em;margin:0;text-wrap:balance;
  }
  h2{
    font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;
    letter-spacing:-.022em;margin:0 0 22px;text-wrap:balance;
  }
  h2 em{font-style:normal;color:var(--trace)}
  p{margin:0;font-size:19px;line-height:1.6;color:var(--ink-2);max-width:62ch}
  p strong{color:var(--ink);font-weight:500}
  .lead{font-size:22px;color:var(--ink)}
  .mono{font-family:var(--mono)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- layout helpers ---------- */
  .cols{display:grid;gap:44px;flex:1;min-height:0}
  .c-6-6{grid-template-columns:1fr 1fr}
  .c-7-5{grid-template-columns:1.32fr 1fr}
  .c-5-7{grid-template-columns:1fr 1.32fr}
  .stack{display:flex;flex-direction:column;gap:20px;min-height:0}
  .stack.mid{justify-content:center}
  .grow{flex:1;min-height:0}

  /* ---------- instrument readout panels ---------- */
  .screen{
    background:#0d1017;border:1px solid var(--rule);border-radius:3px;
    position:relative;overflow:hidden;
  }
  .screen canvas{display:block;width:100%;height:100%}
  .screen .cap{
    position:absolute;left:12px;top:10px;font-family:var(--mono);
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  }
  .screen .val{
    position:absolute;right:12px;top:9px;font-family:var(--mono);
    font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2);
  }
  .screen .val b{color:var(--ink);font-weight:600}
  .screen.ok .cap{color:var(--good)}
  .screen.bad .cap{color:var(--fail)}

  /* ---------- data list: label left, value right, hairline between ---------- */
  .spec{display:flex;flex-direction:column;font-family:var(--mono);font-size:15px}
  .spec div{
    display:flex;justify-content:space-between;gap:24px;
    padding:11px 0;border-bottom:1px solid var(--rule);
  }
  .spec div:last-child{border-bottom:0}
  .spec dt,.spec span:first-child{color:var(--ink-3)}
  .spec b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .spec .hi{color:var(--trace)}

  /* ---------- ordered process: numbers only where order is real ---------- */
  ol.steps{
    margin:0;padding:0;list-style:none;counter-reset:s;
    display:flex;flex-direction:column;gap:14px;
  }
  /* Marker is positioned, not a grid track: a 1fr text track inside this
     flex column collapses to min-content and wraps one word per line. */
  ol.steps li{
    counter-increment:s;position:relative;padding-left:50px;
    font-size:18px;line-height:1.5;color:var(--ink-2);
  }
  ol.steps li::before{
    content:counter(s);position:absolute;left:0;top:1px;
    font-family:var(--mono);font-size:13px;font-weight:600;
    color:var(--trace);border:1px solid var(--rule);border-radius:2px;
    width:27px;height:26px;display:grid;place-items:center;
  }
  ol.steps li b{color:var(--ink);font-weight:500}

  ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px}
  ul.plain li{
    font-size:18px;line-height:1.5;color:var(--ink-2);
    padding-left:20px;position:relative;
  }
  ul.plain li::before{
    content:"";position:absolute;left:0;top:.62em;width:8px;height:1px;background:var(--trace);
  }
  ul.plain li b{color:var(--ink);font-weight:500}

  /* ---------- code ---------- */
  pre{
    margin:0;font-family:var(--mono);font-size:15.5px;line-height:1.75;
    background:#0d1017;border:1px solid var(--rule);border-radius:3px;
    padding:20px 22px;color:var(--ink-2);overflow-x:auto;
  }
  pre b{color:var(--ink);font-weight:600}
  pre i{color:var(--ink-3);font-style:normal}
  pre .k{color:var(--trace)}
  pre .g{color:var(--good)}
  pre .o{color:var(--force)}

  /* ---------- big figure ---------- */
  .figs{display:flex;gap:40px;align-items:flex-end}
  .fig{display:flex;flex-direction:column;gap:4px}
  .fig .v{
    font-family:var(--display);font-weight:700;font-size:52px;line-height:1;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .fig .u{font-family:var(--mono);font-size:12px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3)}
  .fig.t .v{color:var(--trace)}
  .fig.g .v{color:var(--good)}
  .fig.f .v{color:var(--force)}

  /* ---------- comparison table ---------- */
  table{border-collapse:collapse;width:100%;font-size:16.5px}
  caption{text-align:left;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-3);padding-bottom:12px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
  thead th{
    font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-3);border-bottom-color:var(--ink-3);
  }
  tbody th{font-weight:400;color:var(--ink-2);width:46%}
  td{font-family:var(--mono);font-size:15px;color:var(--ink)}
  td.no{color:var(--good)}
  td.yes{color:var(--force)}

  /* ---------- alpha ladder ---------- */
  .ladder{display:flex;flex-direction:column;gap:9px}
  .ladder div{display:grid;grid-template-columns:96px 1fr 78px;gap:14px;align-items:center;
    font-family:var(--mono);font-size:14px;color:var(--ink-3)}
  .ladder i{height:9px;background:var(--force);border-radius:1px;display:block;opacity:.85}
  .ladder b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;text-align:right}

  /* ---------- chart ---------- */
  #chartwrap{flex:1;min-height:0;display:flex}
  svg{width:100%;height:100%;overflow:visible}
  .ax{stroke:var(--rule);stroke-width:1}
  .axt{fill:var(--ink-3);font-family:var(--mono);font-size:12px}
  .lblt{fill:var(--ink);font-family:var(--mono);font-size:12.5px}

  /* ---------- title slide ---------- */
  .hero{display:grid;grid-template-columns:1.1fr 1fr;gap:52px;flex:1;align-items:center}
  .byline{
    font-family:var(--mono);font-size:13px;color:var(--ink-3);
    display:flex;gap:10px;align-items:center;margin-top:30px;
  }
  .byline s{text-decoration:none;color:var(--rule)}

  /* ---------- rail ---------- */
  #rail{
    position:absolute;left:76px;right:76px;bottom:26px;height:30px;
    display:flex;align-items:center;gap:20px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-3);
    border-top:1px solid var(--rule);padding-top:14px;
  }
  #ticks{display:flex;gap:4px;flex:1}
  #ticks b{flex:1;height:3px;background:var(--rule);border-radius:2px;display:block}
  #ticks b.done{background:var(--ink-3)}
  #ticks b.now{background:var(--trace)}
  #clock{font-variant-numeric:tabular-nums;color:var(--ink-2)}
  #clock.run{color:var(--good)}
  #idx{font-variant-numeric:tabular-nums}

  /* ---------- notes ---------- */
  #notes{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--panel);border-top:1px solid var(--rule);
    padding:20px 26px 22px;max-height:44vh;overflow-y:auto;
    display:none;
  }
  #notes.open{display:block}
  #notes{max-height:56vh}
  #notes .lex h4{
    font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--trace);margin:16px 0 5px;
  }
  #notes .lexgrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0 26px;
  }
  #notes .lexgrid span{
    display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.45;
    padding:4px 0;border-bottom:1px solid var(--rule);
  }
  #notes .lexgrid b{color:var(--ink);font-weight:500;white-space:nowrap}
  #notes .lexgrid i{
    font-style:normal;color:var(--trace);font-size:11.5px;white-space:nowrap;
  }
  #notes .lexgrid em{
    font-style:normal;color:var(--ink-3);flex:1;min-width:0;text-align:right;
    font-family:var(--body);font-size:12.5px;
  }
  #notes h3{
    font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--trace);margin:0 0 10px;
  }
  #notes p{font-size:15px;line-height:1.62;max-width:96ch;color:var(--ink-2)}
  #notes p+p{margin-top:9px}
  #notes .say{color:var(--ink)}
  #notes kbd{
    font-family:var(--mono);font-size:12px;background:var(--panel-2);
    border:1px solid var(--rule);border-radius:3px;padding:1px 6px;color:var(--ink);
  }
  #help{
    position:fixed;right:14px;top:12px;z-index:20;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);
  }
  #help kbd{border:1px solid var(--rule);border-radius:3px;padding:1px 5px;margin:0 1px}

  /* ---------- Japanese typography ---------- */
  .slide[data-lang="JA"] h1{font-size:64px;line-height:1.16;letter-spacing:-.008em}
  .slide[data-lang="JA"] h2{font-size:38px;line-height:1.32;letter-spacing:0}
  .slide[data-lang="JA"] p{font-size:17.5px;line-height:1.86}
  .slide[data-lang="JA"] .lead{font-size:20px}
  .slide[data-lang="JA"] ol.steps li,
  .slide[data-lang="JA"] ul.plain li{font-size:16.5px;line-height:1.82}
  .slide[data-lang="JA"] ol.steps{gap:12px}
  .slide[data-lang="JA"] ul.plain{gap:11px}
  .slide[data-lang="JA"] .spec{font-size:14px}
  .slide[data-lang="JA"] .spec div{padding:9px 0}
  .slide[data-lang="JA"] table{font-size:14.5px}
  .slide[data-lang="JA"] td{font-size:14px}
  .slide[data-lang="JA"] th,.slide[data-lang="JA"] td{padding:10px 12px}
  .slide[data-lang="JA"] .fig .u{letter-spacing:.02em;text-transform:none}
  .slide[data-lang="JA"] .ladder div{font-size:13px}
  .slide[data-lang="JA"] :is(h1,h2,p,li,td,th){line-break:strict;overflow-wrap:break-word}

  @media (prefers-reduced-motion:reduce){
    .ladder i{transition:none}
  }
</style>

  <p>数字は3つだけ。棒を立てるには <span class="say">5.9ジュール</span>必要。7 rad/s で回る棒は、もう5.9ジュール持っている。だから上で止まれない。</p>

  <p><span class="say">「弱いと上がりません。強いと止まりません。答えは『強く押す』ではなく『いいタイミングで押す』です。」</span></p>`,
  html:`<p class="eyebrow">力任せが通じない理由</p>
  <h2>これは力の問題ではなく<em>エネルギー</em>の問題</h2>
  <div class="cols c-7-5">
    <div class="stack mid">
      <div class="figs">
        <div class="fig t"><span class="v">5.9</span><span class="u">立てるのに必要なジュール</span></div>
        <div class="fig f"><span class="v">7.0</span><span class="u">rad/s — すでに同量を持つ</span></div>
        <div class="fig"><span class="v">1 W</span><span class="u">摩擦が抜く速さ</span></div>
      </div>
      <p style="margin-top:8px">棒を立てるコストは <span class="mono">2mgl = 5.9 J</span>。
      <span class="mono">7 rad/s</span> で回る棒は <span class="mono">&frac12;J&omega;&sup2;</span> だけで
      すでにそれだけ持っているので、この速さを超えると物理的に上で止まれない。通り過ぎてしまい、
      摩擦で抜けるまでに6秒かかる。</p>
      <p><strong>エネルギーを速く抜く方法は、振れに逆らって押すことだけ</strong>。しかも回転の特定の位相で:
      <span class="mono">dE/dt = &minus;m&thinsp;l&thinsp;&#7821;&thinsp;&theta;&#775;&thinsp;cos&thinsp;&theta;</span>。
      位相を外すと、逆にエネルギーを足してしまう。手動で操縦すると絶望的に感じるのはこれが理由。</p>
    </div>
    <div class="screen bad" data-clip="untrained" data-loop="1">

  <h2>入力は5つ、出力は<em>1つ</em></h2>
  <div class="cols c-6-6">
    <div class="stack mid">
      <pre><i># エージェントが毎秒50回受け取るもの</i>
obs = [
  x / <span class="k">2.4</span>,        <i># レール上の台車位置</i>
  x_dot / <span class="k">5</span>,      <i># 台車の速度</i>
  <span class="g">cos</span>(theta),     <i># 棒の角度を、ベクトルとして…</i>
  <span class="g">sin</span>(theta),     <i># …pi と -pi が同一点になる</i>
  theta_dot / <span class="k">10</span>, <i># 棒の角速度</i>
]

<i># 出力するもの</i>
force = action * <span class="o">15.0</span>   <i># action は [-1, 1]</i></pre>

        <li><b>模範例もない。</b>人間の操作記録も、台本による助走もなし。</li>
        <li><b>角度は数値ではなくベクトル。</b>生の <span class="mono">theta</span> を渡すと

      </ul>
    </div>
  </div>`

  html:`<p class="eyebrow">報酬 — 仕様のすべて</p>
  <h2>4行、そのうち<em>1行</em>が本質</h2>
  <div class="cols c-7-5">
    <div class="stack mid">
      <pre>upright  = (<span class="k">1</span> + cos(theta)) / <span class="k">2</span>       <i># 真下0、真上1</i>
slow     = <span class="k">1</span> / (<span class="k">1</span> + <span class="k">0.1</span>*theta_dot**<span class="k">2</span>)  <i># 静止で1</i>
centered = <span class="k">1</span> / (<span class="k">1</span> + <span class="k">0.5</span>*(x/<span class="k">2.4</span>)**<span class="k">2</span>)  <i># 中央で1</i>

reward = upright <b>*</b> (<span class="k">0.5</span> + <span class="k">0.5</span>*slow) <b>*</b> centered</pre>
      <p>1ステップあたり最大 <span class="mono">1.0</span>。10秒を完璧にこなせば
      <span class="mono">500</span> 点。振り上げに約60ステップかかるので、現実的な上限は
      <span class="mono">450</span> あたり。</p>
    </div>
    <div class="stack mid">
      <ul class="plain">
        <li><b>足し算ではなく掛け算。</b>和にすると、速い回転がどこでも罰せられる — 速い回転こそ
        目的である真下も含めて。</li>
        <li><b>ペナルティが自分でゲートされる。</b><span class="mono">upright &asymp; 0</span> の間は
        静止の項は無関係。真上に近づくと支配的になる。</li>
        <li><b>和にすると永遠に振らない。</b>局所的に安全な行動を学ぶ — じっとして、何も稼がず、
        罰も受けない。</li>
      </ul>
    </div>
  </div>`
},

/* ============================== rendering ============================== */

const stage = document.getElementById("stage");
const rail = document.createElement("div");
rail.id = "rail";
rail.innerHTML = `<span id="idx"></span><span id="ticks"></span><span id="target"></span><span id="clock">0:00</span>`;

SLIDES.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  el.dataset.lang = s.lang;
  el.innerHTML = s.html;
  stage.appendChild(el);
});
stage.appendChild(rail);

const slideEls = [...stage.querySelectorAll(".slide")];
const ticks = document.getElementById("ticks");
SLIDES.forEach(() => ticks.appendChild(document.createElement("b")));
const tickEls = [...ticks.children];

let cur = 0;

/* ---- fit the fixed stage into whatever window it's shown in ---- */
function fit() {
  const pad = 24;
  const s = Math.min((innerWidth - pad) / 1280, (innerHeight - pad) / 720);
  stage.style.setProperty("--s", s);
}
addEventListener("resize", fit);
fit();

/* ---- cart-pole renderer, driven by the recorded trajectories ---- */
function drawRig(cv, clip, i) {
  const ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr)) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const n = clip.x.length;
  const k = Math.min(i, n - 1);
  const x = clip.x[k], th = clip.th[k];
  const a = clip.a[Math.min(k, clip.a.length - 1)] || 0;

  const groundY = h * 0.72;
  const scale = Math.min((w - 26) / (2 * P.x_limit + 0.7), (groundY - 26) / (P.pole_length * 1.18));
  const SX = v => w / 2 + v * scale;
  const SY = v => groundY - v * scale;

  /* goal height */
  ctx.strokeStyle = "#22402f";
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(10, SY(P.pole_length)); ctx.lineTo(w - 10, SY(P.pole_length)); ctx.stroke();

  /* rail and end stops */
  ctx.strokeStyle = "#2b3140"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(SX(-P.x_limit), groundY + 13); ctx.lineTo(SX(P.x_limit), groundY + 13); ctx.stroke();
  ctx.strokeStyle = "#ef6673"; ctx.lineWidth = 2;
  for (const e of [-P.x_limit, P.x_limit]) {
    ctx.beginPath(); ctx.moveTo(SX(e), groundY - 3); ctx.lineTo(SX(e), groundY + 21); ctx.stroke();
  }

  /* tip trail: the widening arcs are the energy going in */
  ctx.strokeStyle = "#2c4a70"; ctx.lineWidth = 1.4;
  ctx.beginPath();
  const from = Math.max(0, k - 70);
  for (let j = from; j <= k; j++) {
    const px = SX(clip.x[j] + P.pole_length * Math.sin(clip.th[j]));
    const py = SY(P.pole_length * Math.cos(clip.th[j]));
    j === from ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();

  /* applied force */
  if (Math.abs(a) > 0.02) {
    ctx.strokeStyle = "#f2a65a"; ctx.lineWidth = 3; ctx.lineCap = "butt";
    ctx.beginPath();
    ctx.moveTo(SX(x), groundY + 4);
    ctx.lineTo(SX(x) + a * 0.62 * scale, groundY + 4);
    ctx.stroke();
  }

  /* cart */
  const cw = 0.56 * scale, ch = 0.22 * scale;
  ctx.fillStyle = "#3d465b";
  ctx.beginPath(); ctx.roundRect(SX(x) - cw / 2, groundY - ch / 2, cw, ch, 3); ctx.fill();

  /* rod */
  const wrapped = ((th + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  const up = Math.abs(wrapped) < 0.2;
  const tipX = SX(x + P.pole_length * Math.sin(th));
  const tipY = SY(P.pole_length * Math.cos(th));
  ctx.strokeStyle = up ? "#5fd39a" : "#e6e9f0";
  ctx.lineWidth = Math.max(3, 0.045 * scale); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(SX(x), groundY - ch / 2); ctx.lineTo(tipX, tipY); ctx.stroke();
  ctx.fillStyle = up ? "#5fd39a" : "#63b3ff";
  ctx.beginPath(); ctx.arc(tipX, tipY, Math.max(4, 0.05 * scale), 0, 7); ctx.fill();
}

/* ---- animation: one loop, only the live slide's screens ---- */
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let frame = 0, lastT = performance.now(), accum = 0;

function buildScreens(el) {
  return [...el.querySelectorAll(".screen[data-clip]")].map(sc => {
    let cv = sc.querySelector("canvas");
    if (!cv) { cv = document.createElement("canvas"); sc.appendChild(cv); }
    return { sc, cv, clip: CLIP[sc.dataset.clip], val: sc.querySelector("[data-live]") };
  });
}

function tick(now) {
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  if (!reduced) {
    accum += dt / P.dt;
    while (accum >= 1) { accum -= 1; frame += 1; }
  }
  const screens = slideEls[cur]._screens || (slideEls[cur]._screens = buildScreens(slideEls[cur]));
  for (const s of screens) {
    const n = s.clip.x.length;
    const i = frame % (n + 40);              /* short hold before looping */
    const j = Math.min(i, n - 1);
    drawRig(s.cv, s.clip, j);
    if (s.val) {
      const secs = (j * P.dt).toFixed(1);
      s.val.innerHTML = `${secs}s &nbsp; <b>${s.clip.ret}</b>`;
    }
  }
  requestAnimationFrame(tick);
}

/* ---- the training curve, drawn to one scale ---- */
const CHART_TEXT = {
  en:{ y:"reward per episode", x:"training episode",
       ref:"hand-written controller &mdash; 449", dip:"it got worse here",
       first:"first reliable balance &mdash; episode 70" },
  ja:{ y:"1エピソードあたり報酬", x:"学習エピソード",
       ref:"手書きコントローラ &mdash; 449", dip:"ここで悪化した",
       first:"初めて安定して静止 &mdash; エピソード70" },
};

function drawChart() {
  for (const svg of document.querySelectorAll("svg.chart:not([data-done])")) drawOneChart(svg);
}

function drawOneChart(svg) {
  const TX = CHART_TEXT[svg.dataset.lang] || CHART_TEXT.en;
  const c = DATA.curve, W = 1128, H = 430, L = 58, R = 14, T = 34, B = 52;
  const maxEp = c.length - 1;
  const maxR = 500;
  const px = e => L + (e / maxEp) * (W - L - R);
  const py = r => H - B - (r / maxR) * (H - T - B);
  let g = "";

  for (let v = 0; v <= 500; v += 100) {
    g += `<line class="ax" x1="${L}" y1="${py(v)}" x2="${W - R}" y2="${py(v)}"/>`
       + `<text class="axt" x="${L - 10}" y="${py(v) + 4}" text-anchor="end">${v}</text>`;
  }
  for (let e = 0; e <= maxEp; e += 100) {
    g += `<text class="axt" x="${px(e)}" y="${H - B + 20}" text-anchor="middle">${e}</text>`;
  }
  /* Axis titles sit outside the plot: above it, and below the tick row, so
     neither can collide with a tick label in either language. */
  g += `<text class="axt" x="${L}" y="${T - 19}">${TX.y}</text>`;
  g += `<text class="axt" x="${W - R}" y="${H - 6}" text-anchor="end">${TX.x}</text>`;

  /* engineered-controller reference */
  g += `<line x1="${L}" y1="${py(449)}" x2="${W - R}" y2="${py(449)}"
        stroke="#f2a65a" stroke-width="1.6" stroke-dasharray="7 5"/>`
     + `<text class="lblt" x="${W - R - 6}" y="${py(449) - 10}" text-anchor="end"
        fill="#f2a65a">${TX.ref}</text>`;

  /* raw per-episode returns */
  g += `<path fill="none" stroke="#2c4a70" stroke-width="1.2" d="${
    c.map((r, e) => `${e ? "L" : "M"}${px(e).toFixed(1)},${py(r).toFixed(1)}`).join("")}"/>`;

  /* 10-episode mean */
  const sm = c.map((_, i) => {
    const w = c.slice(Math.max(0, i - 9), i + 1);
    return w.reduce((s, v) => s + v, 0) / w.length;
  });
  g += `<path fill="none" stroke="#63b3ff" stroke-width="2.6" stroke-linejoin="round" d="${
    sm.map((r, e) => `${e ? "L" : "M"}${px(e).toFixed(1)},${py(r).toFixed(1)}`).join("")}"/>`;

  /* checkpoint evals */
  for (const k of DATA.ckpts) {
    g += `<circle cx="${px(k.e).toFixed(1)}" cy="${py(k.r).toFixed(1)}" r="3.4" fill="#5fd39a"/>`;
  }

  /* the annotation the whole slide exists for */
  const dipX = px(52), dipY = py(30);
  g += `<line x1="${dipX + 7}" y1="${dipY - 4}" x2="${px(146)}" y2="${py(186)}"
        stroke="#79839a" stroke-width="1"/>`
     + `<circle cx="${dipX}" cy="${dipY}" r="6" fill="none" stroke="#ef6673" stroke-width="1.6"/>`
     + `<text class="lblt" x="${px(150)}" y="${py(180)}" fill="#ef6673">${TX.dip}</text>`;
  /* Parked in the empty band below the plateau, not on top of the curve. */
  g += `<text class="lblt" x="${px(140)}" y="${py(315)}">${TX.first}</text>`
     + `<line x1="${px(136)}" y1="${py(322)}" x2="${px(74)}" y2="${py(396)}"
        stroke="#79839a" stroke-width="1"/>`;

  svg.innerHTML = g;
  svg.dataset.done = "1";
}

/* ============================== navigation ============================== */

const notes = document.getElementById("notes");
const nTitle = document.getElementById("ntitle");
const nBody = document.getElementById("nbody");

function show(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  slideEls.forEach((el, k) => el.classList.toggle("live", k === cur));
  tickEls.forEach((b, k) => {
    b.className = k < cur ? "done" : k === cur ? "now" : "";
  });
  const s = SLIDES[cur];
  document.getElementById("idx").textContent =
    s.lang + " " + String(s.n).padStart(2, "0") + " / " + s.of;
  document.getElementById("target").textContent = "target " + s.t;
  nTitle.textContent = s.lang === "JA"
    ? `${s.lang} スライド ${s.n} / ${s.of} — 目標 ${s.t}`
    : `${s.lang} slide ${s.n} of ${s.of} — target ${s.t}`;
  nBody.innerHTML = SLIDES[cur].note;
  frame = 0; accum = 0;
  drawChart();
  history.replaceState(null, "", "#" + (cur + 1));
}

let t0 = null;
function clockTick() {
  const el = document.getElementById("clock");
  if (t0 === null) return;
  const s = Math.floor((Date.now() - t0) / 1000);
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
setInterval(clockTick, 500);

addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowRight" || k === "PageDown" || k === " ") { e.preventDefault(); show(cur + 1); }
  else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); show(cur - 1); }
  else if (k === "Home") show(0);
  else if (k === "End") show(SLIDES.length - 1);
  else if (k === "n" || k === "N") notes.classList.toggle("open");
  else if (k === "r" || k === "R") { frame = 0; accum = 0; }
  else if (k === "t" || k === "T") {
    const el = document.getElementById("clock");
    if (t0 === null) { t0 = Date.now(); el.classList.add("run"); }
    else { t0 = null; el.classList.remove("run"); el.textContent = "0:00"; }
  }
});
addEventListener("click", e => {
  if (notes.contains(e.target) || e.target.closest("#help")) return;
  show(cur + 1);
});

/* deep link: #6 opens slide 6, so a rehearsal can start anywhere */
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
requestAnimationFrame(tick);
</script>
